# Запуск: docker compose up --build
# Остановка: Ctrl+C или docker compose down
# Чистая база: docker compose down -v
services:
  teamplan:
    build: .
    image: teamplan
    ports:
      # ТБ-6: приложение доступно только с этого компьютера.
      - "127.0.0.1:8501:8501"
    environment:
      TEAMPLAN_DB: /data/teamplan.db
      # Часовой пояс команды: от него зависят проверки «событие началось»
      # и «срок в прошлом». По умолчанию Москва, можно задать переменной TZ.
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - teamplan-data:/data
    restart: unless-stopped

volumes:
  teamplan-data:
