# Автоматическая проверка TeamPlan.
# Запускается при каждом pull request, при изменениях в main
# и вручную (вкладка Actions → «Тесты» → Run workflow).
name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # ТП-1: без Docker поддерживаются Python 3.12 и 3.13.
        python-version: ["3.12", "3.13"]
    # ТП-5: тесты выполняются на PostgreSQL 17.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: teamplan_test
          POSTGRES_USER: teamplan
          POSTGRES_PASSWORD: teamplan-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamplan -d teamplan_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Тот же часовой пояс, что и в docker-compose.yml: от него зависят
      # правила «событие началось» и «срок в прошлом».
      TZ: Europe/Moscow
      TEST_DATABASE_URL: postgresql://teamplan:teamplan-ci@localhost:5432/teamplan_test
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Запустить тесты
        run: python -m pytest -v

  docker:
    name: Docker (приложение и PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      # Как у пользователя по README: без файла .env, значения по умолчанию.
      - name: Собрать и запустить приложение вместе с СУБД
        run: docker compose up -d --build

      - name: Проверить, что приложение отвечает
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo
              echo "Приложение запустилось."
              exit 0
            fi
            sleep 2
          done
          echo "Приложение не ответило за 90 секунд."
          exit 1

      - name: Журнал контейнеров
        if: always()
        run: docker compose logs || true

      - name: Остановить и удалить контейнеры и том базы
        if: always()
        run: docker compose down -v || true
