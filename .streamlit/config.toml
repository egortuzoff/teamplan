[browser]
gatherUsageStats = false

[client]
# Скрывает кнопку Deploy и другие пункты меню для разработчика.
toolbarMode = "viewer"

# Оформление «Табло» (НТ-7): тёмный фон, светлый текст, голубой основной цвет.
# Контраст (WCAG), норма 4.5:1:
#   текст #EAF1FB на фоне #0A1428 — 16.2:1, на втором фоне #101E3A — 14.6:1;
#   основной #7CC4FF на фоне — 9.8:1, на втором фоне — 8.8:1;
#   тёмный текст #0A1428 на основной кнопке #7CC4FF — 9.8:1.
# Дополнительные цвета и проверка всех пар — в teamplan/tablo.py
# и тесте tests/test_tablo.py.
[theme]
base = "dark"
primaryColor = "#7CC4FF"
backgroundColor = "#0A1428"
secondaryBackgroundColor = "#101E3A"
textColor = "#EAF1FB"
linkColor = "#7CC4FF"
borderColor = "#1E2C4A"
# Шрифты из Google Fonts: Golos Text — текст, Oswald — заголовки,
# JetBrains Mono — цифры счёта и статистики в своих блоках главного экрана.
font = "'Golos Text':https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap"
headingFont = "Oswald:https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap"
# Янтарный — «требует действия», «счёт не внесён», непрочитанные уведомления.
orangeColor = "#FFB020"
orangeTextColor = "#FFD27A"
orangeBackgroundColor = "#3A2A0B"
# Зелёный — «Буду», «Вы в составе», «Победа».
greenTextColor = "#8BF0B7"
greenBackgroundColor = "#12422E"
