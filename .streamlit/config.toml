[browser]
gatherUsageStats = false

[client]
# Скрывает кнопку Deploy и другие пункты меню для разработчика.
toolbarMode = "viewer"

# Цвета команды ХК «Иркутский Политех»: синий из логотипа и белый.
# Контраст (WCAG): текст на белом 15.7:1, на светло-голубом 13.3:1,
# белый текст на синих кнопках 12.4:1, синий на светло-голубом 10.5:1 —
# везде выше нормы 4.5:1.
[theme]
base = "light"
primaryColor = "#2A2F66"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#E6EDF8"
textColor = "#1A1F4B"
linkColor = "#2A2F66"
borderColor = "#C5D2EA"
